<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gmail Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #111827;
      color: #d1d5db;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px 11px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }
    .title { display: flex; align-items: center; gap: 8px; }
    .title span { font-size: 17px; }
    h1 { font-size: 14px; font-weight: 600; color: #f9fafb; letter-spacing: 0.2px; }
    #refresh {
      background: none;
      border: 1px solid #374151;
      color: #9ca3af;
      border-radius: 6px;
      width: 30px;
      height: 28px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #refresh:hover { background: #374151; color: #f9fafb; }
    .settings {
      padding: 10px 16px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }
    .settings label {
      display: block;
      font-size: 10px;
      color: #6b7280;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .input-row { display: flex; gap: 6px; }
    #serverUrl {
      flex: 1;
      padding: 6px 9px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #d1d5db;
      font-size: 12px;
      transition: border-color 0.15s;
    }
    #serverUrl:focus { outline: none; border-color: #3b82f6; }
    #saveUrl {
      padding: 6px 12px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    #saveUrl:hover { background: #1d4ed8; }
    .status-bar {
      height: 22px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      font-size: 11px;
      color: #4ade80;
    }
    .status-bar.error { color: #f87171; }
    #email-list { max-height: 340px; overflow-y: auto; }
    #email-list::-webkit-scrollbar { width: 4px; }
    #email-list::-webkit-scrollbar-track { background: transparent; }
    #email-list::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .placeholder {
      padding: 36px 16px;
      text-align: center;
      color: #4b5563;
      line-height: 1.7;
    }
    .placeholder small { font-size: 11px; display: block; margin-top: 4px; color: #374151; }
    .email-item {
      padding: 10px 16px;
      border-bottom: 1px solid #1f2937;
      transition: background 0.1s;
    }
    .email-item:hover { background: #1f2937; }
    .email-item:last-child { border-bottom: none; }
    .subject {
      font-weight: 500;
      color: #f3f4f6;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .to {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      font-weight: 500;
    }
    .badge.sent { background: #1e3a5f; color: #60a5fa; }
    .badge.opened { background: #052e16; color: #4ade80; }
    .time { font-size: 11px; color: #4b5563; }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>📧</span>
      <h1>Gmail Tracker</h1>
    </div>
    <button id="refresh" title="Refresh statuses">↻</button>
  </header>

  <div class="settings">
    <label>Tracker Server URL</label>
    <div class="input-row">
      <input type="url" id="serverUrl" placeholder="http://localhost:3001">
      <button id="saveUrl">Save</button>
    </div>
  </div>

  <div id="localhost-warn" style="display:none;padding:7px 16px;background:#431407;color:#fb923c;font-size:11px;line-height:1.5;">
    ⚠ Server is localhost — recipients on other devices can't reach it. Deploy to a public URL for real tracking.
  </div>
  <div id="status-bar" class="status-bar"></div>

  <div id="email-list">
    <div class="placeholder">Loading…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
